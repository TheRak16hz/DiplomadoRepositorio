<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Editar Rol</title>
	<link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="tarjeta-contenedor">
    <div class="cabecera-logo">
    <img th:src="@{/Imágenes/logo.png}" alt="Logo de la red social" class="img-fluid w-25">
        <h1 class="text-lg font-bold">Editar Rol</h1>
    </div>

    <div class="contenido-principal">
        <h2 class="titulo-seccion">Editar Rol</h2>
        <form th:action="@{/rol_editar}" th:object="${rol}" class="formulario" method="post">
        <div class="rejilla-formulario">
            <div class="campo">
                <input type="hidden" th:field="*{cod_rol}" />
                <label for="nom_rol" class="etiqueta"
                    >Nombre Del Rol</label>
                <input type="text" id="nom_rol" name="nom_rol" th:field="*{nom_rol}" class="entrada" required maxlength="100"/>
                <span class="error-message"></span>
            </div>
            <div class="campo">
            <label for="des_rol" class="etiqueta">Descripcion del Rol</label>
            <textarea id="des_rol" name="des_rol" th:field="*{des_rol}" class="entrada" maxlength="1000"></textarea>
            <span class="error-message"></span>
            </div>
            <div class="campo">
            <label for="est_fan_page" class="etiqueta">Estatus</label>
            <select id="est_fan_page" name="est_rol"  th:field="*{est_rol}" class="entrada" required>
                <option value="A">Activo</option>
                <option value="I">Inactivo</option>
            </select>
            <span class="error-message"></span>
            </div>
        </div>
        <div class="contenedor-botones">
            <button type="submit" class="boton-accion">Editar</button>
            <a th:href='@{/rol}' class="boton-secundario">Volver</a>
        </div>
        </form>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"crossorigin="anonymous"></script>  
</body>
</html>
