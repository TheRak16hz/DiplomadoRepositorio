<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agregar Rol Fan Page</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}" />
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="tarjeta-contenedor">
      <div class="cabecera-logo">
        <img
          th:src="@{/imagenes/logo.jpeg}"
          alt="Logo de la red social"
          class="img-fluid w-25"
        />
        <h1 class="text-lg font-bold">Registro Rol Fan Page</h1>
      </div>

      <div class="contenido-principal">
        <h2 class="titulo-seccion">Agregar Nuevo Rol Fan Page</h2>

        <form
          th:action="@{/rol_fan_page_agregar}"
          th:object="${rolFanPage}"
          class="formulario"
          method="post"
        >
          <div class="rejilla-formulario">
            <div class="campo">
              <label for="persona" class="etiqueta">Persona</label>
              <select
                id="persona"
                name="persona"
                th:field="*{persona}"
                class="entrada"
                required
              >
                <option value="">Seleccione...</option>
                <option th:each="p : ${personas}" th:value="${p.cod_per}" th:text="${p.nm1_per + ' ' + p.ap1_per}"></option>
              </select>
              <span class="error-message"></span>
            </div>

            <div class="campo">
              <label for="fan_page" class="etiqueta">Fan Page</label>
              <select
                id="fan_page"
                name="fan_page"
                th:field="*{fan_page}"
                class="entrada"
                required
              >
                <option value="">Seleccione...</option>
                <option th:each="fp : ${fanPages}" th:value="${fp.cod_fan_pag}" th:text="${fp.nom_fan_pag}"></option>
              </select>
              <span class="error-message"></span>
            </div>

            <div class="campo">
              <label for="rol" class="etiqueta">Rol</label>
              <select
                id="rol"
                name="rol"
                th:field="*{rol}"
                class="entrada"
                required
              >
                <option value="">Seleccione...</option>
                <option th:each="r : ${roles}" th:value="${r.cod_rol}" th:text="${r.nom_rol}"></option>
              </select>
              <span class="error-message"></span>
            </div>

            <div class="campo">
              <label for="est_rol_fan" class="etiqueta">Estatus</label>
              <select
                id="est_rol_fan"
                name="est_rol_fan"
                th:field="*{est_rol_fan}"
                class="entrada"
                required
              >
                <option value="">Seleccione...</option>
                <option value="A">Activo</option>
                <option value="I">Inactivo</option>
              </select>
              <span class="error-message"></span>
            </div>
          </div>
          <div class="contenedor-botones">
            <button type="submit" class="boton-accion">Guardar Registro</button>
            <a th:href="@{/rol_fan_page}" class="boton-secundario">Volver</a>
          </div>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script th:inline="javascript">
      document.addEventListener("DOMContentLoaded", function () {
        // CORREGIDO: Sintaxis segura para leer la variable de Thymeleaf
        // Si 'mensaje' es null, asigna una cadena vacía para evitar errores
        var mensaje = /*[[${mensaje}]]*/ "";

        if (mensaje === "exito") {
          Swal.fire({
            title: "¡Logrado!",
            text: "Se ha registrado correctamente.",
            icon: "success",
            confirmButtonColor: "#3085d6",
            timer: 3000,
          });
        } else if (mensaje === "error") {
          Swal.fire({
            title: "Error",
            text: "No se pudo realizar la inserción. Inténtalo de nuevo.",
            icon: "error",
            confirmButtonColor: "#d33",
          });
        }
      });
    </script>
  </body>
</html>
