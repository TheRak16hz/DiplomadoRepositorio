<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Tipo Privacidad</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="tarjeta-contenedor">
        <div class="cabecera-logo">
            <img th:src="@{/Imágenes/logo.png}" alt="Logo de la red social" class="img-fluid w-25">
            <h1 class="text-lg font-bold">Editar Tipo Privacidad</h1>
        </div>

        <div class="contenido-principal">
            <h2 class="titulo-seccion">Editar Tipo Privacidad</h2>
            <form th:action="@{/tipo_privacidad_editar}" th:object="${tipoPrivacidad}" class="formulario" method="post">
                <div class="rejilla-formulario">
                    <div class="campo">
                        <input type="hidden" th:field="*{cod_tip}" />
                        <label for="nom_tip" class="etiqueta">Nombre</label>
                        <input type="text" id="nom_tip" name="nom_tip" th:field="*{nom_tip}" class="entrada" required
                            maxlength="100" />
                        <span class="error-message"></span>
                    </div>

                    <div class="campo">
                        <label for="est_tip" class="etiqueta">Estatus</label>
                        <select id="est_tip" name="est_tip" th:field="*{est_tip}" class="entrada" required>
                            <option value="A">Activo</option>
                            <option value="I">Inactivo</option>
                        </select>
                        <span class="error-message"></span>
                    </div>
                </div>
                <div class="contenedor-botones">
                    <button type="submit" class="boton-accion">Editar</button>
                    <a th:href='@{/tipo_privacidad}' class="boton-secundario">Volver</a>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
