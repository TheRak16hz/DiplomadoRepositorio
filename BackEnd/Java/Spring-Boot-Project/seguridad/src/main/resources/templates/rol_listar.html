<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/4.2-rol_listar.css}">
    <!--<link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/2-seguridad.css}">-->
    <title>Listar Rol</title>
  </head>
  <body>
    <div class="contenedor-tarjeta">
      <div class="cabecera-logo">
       <img th:src="@{/img/logo.png}" alt="imagen logo" class="logo-imagen" />
      </div>

      <div class="contenido-principal">
        <div class="titulo-solicitud">Datos Roles</div>

        <div class="contenedor-tabla">
          <table class="tabla-centrada">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nombre Del Rol</th>
                <th>Descripción del Rol</th>
                <th>Estatus</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(rols)}">
                    <td colspan="5" class="text-center"> No hay roles registrados.</td>
                </tr>
                <tr th:each="rol : ${rols}" class="text-center">
                    <td class="text-center" th:text="*{rol.cod_rol}"></td> 
                    <td class="text-center" th:text="*{rol.nom_rol}"></td>
                    <td class="text-center" th:text="*{rol.des_rol}"></td>
                    <td class="text-center" th:text="*{rol.est_rol}"></td>
                    <td class="text-center acciones-tabla">
                        <a href="4.1-rol_agregar.html" class="boton-accion-tabla" title="Editar">Editar</a> 
                        <a href="#" class="boton-accion-tabla" title="Eliminar">Eliminar</a>
                    </td>
                </tr> 
            </tbody>
          </table>
        </div>

        <div class="rejilla-botones">
          <button
            class="boton-accion"
            onclick="window.location.href='rol_agregar.html'"
          >
            Agregar
          </button>
          <button
            class="boton-accion"
            th:onclick="|window.location.href='@{/rol}'|"
          >
            Rol
          </button>
          <button
            class="boton-accion"
            th:onclick="|window.location.href='@{/seguridad}'|"
          >
            Menú Principal
          </button>
        </div>
      </div>
    </div>
    <script src="../JAVASCRIPT/roles.js"></script>
  </body>
</html>
