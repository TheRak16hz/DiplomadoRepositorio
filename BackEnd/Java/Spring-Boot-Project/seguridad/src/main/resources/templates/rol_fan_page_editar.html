<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Rol Fan Page</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="tarjeta-contenedor">
        <div class="cabecera-logo">
            <img th:src="@{/Imágenes/logo.png}" alt="Logo de la red social" class="img-fluid w-25">
            <h1 class="text-lg font-bold">Editar Rol Fan Page</h1>
        </div>

        <div class="contenido-principal">
            <h2 class="titulo-seccion">Editar Rol Fan Page</h2>
            <form th:action="@{/rol_fan_page_editar}" th:object="${rolFanPage}" class="formulario" method="post">
                <div class="rejilla-formulario">
                    <div class="campo">
                        <input type="hidden" th:field="*{cod_rol_fan}" />
                        <label for="persona" class="etiqueta">Persona</label>
                        <select id="persona" name="persona" th:field="*{persona}" class="entrada" required>
                            <option value="">Seleccione...</option>
                            <option th:each="p : ${personas}" th:value="${p.cod_per}" th:text="${p.nm1_per + ' ' + p.ap1_per}" th:selected="${p.cod_per == rolFanPage.persona.cod_per}"></option>
                        </select>
                        <span class="error-message"></span>
                    </div>

                    <div class="campo">
                        <label for="fan_page" class="etiqueta">Fan Page</label>
                        <select id="fan_page" name="fan_page" th:field="*{fan_page}" class="entrada" required>
                            <option value="">Seleccione...</option>
                            <option th:each="fp : ${fanPages}" th:value="${fp.cod_fan_pag}" th:text="${fp.nom_fan_pag}" th:selected="${fp.cod_fan_pag == rolFanPage.fan_page.cod_fan_pag}"></option>
                        </select>
                        <span class="error-message"></span>
                    </div>

                    <div class="campo">
                        <label for="rol" class="etiqueta">Rol</label>
                        <select id="rol" name="rol" th:field="*{rol}" class="entrada" required>
                            <option value="">Seleccione...</option>
                            <option th:each="r : ${roles}" th:value="${r.cod_rol}" th:text="${r.nom_rol}" th:selected="${r.cod_rol == rolFanPage.rol.cod_rol}"></option>
                        </select>
                        <span class="error-message"></span>
                    </div>

                    <div class="campo">
                        <label for="est_rol_fan" class="etiqueta">Estatus</label>
                        <select id="est_rol_fan" name="est_rol_fan" th:field="*{est_rol_fan}" class="entrada" required>
                            <option value="A">Activo</option>
                            <option value="I">Inactivo</option>
                        </select>
                        <span class="error-message"></span>
                    </div>
                </div>
                <div class="contenedor-botones">
                    <button type="submit" class="boton-accion">Editar</button>
                    <a th:href='@{/rol_fan_page}' class="boton-secundario">Volver</a>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
