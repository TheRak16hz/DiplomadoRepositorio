<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href=
        "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/4.2-rol_listar.css}">

    <title>Listar Tipo Privacidad</title>
</head>
<body>
    <div class="contenedor-tarjeta">
    <div class="cabecera-logo">
    <img th:src="@{/imagenes/logo.png}" alt="Logo de la red social" class="img-fluid w-25">
    </div>

    <div class="contenido-principal">
        <div class="titulo-solicitud">Datos Tipos De Privacidad</div>

        <div class="contenedor-tabla">
        <table class="tabla-centrada">
            <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Estatus</th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(tipos)}">
                    <td colspan="6" class="text-center">No hay tipos de Privacidad registrados.</td>
                </tr>
                <tr th:each="tipo : ${tipos}">
                    <td class="text-center" th:text="${tipo.getCod_tip()}"></td>
                    <td class="text-center" th:text="${tipo.getNom_tip()}"></td>
                    <td class="text-center" th:text="${tipo.getEst_tip()}"></td>
                    <td class="text-center acciones-tablas">
                        <a href="tipo_privacidad_editar.html" class="boton-accion-tabla" title="Editar">✎</a>
                        <a href="#" class="boton-accion-tabla" title="Eliminar">🗑</a>
                    </td>
                </tr>

            </tbody>
        </table>
        </div>

        <div class="rejilla-botones">
        <button class="boton-accion" onclick="window.location.href='tipo_privacidad_agregar.html'">Agregar</button>
        <button class="boton-accion"
            th:onclick="|window.location.href='@{/tipo_privacidad}'|">Tipo Privacidad</button>
        <button
            class="boton-accion"
            th:onclick="|window.location.href='@{/seguridad}'|"
          >
            Menú Principal
          </button>
        </div>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
