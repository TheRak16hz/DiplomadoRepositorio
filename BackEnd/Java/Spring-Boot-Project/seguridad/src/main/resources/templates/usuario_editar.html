<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Editar Rol</title>
	<link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="tarjeta-contenedor">
    <div class="cabecera-logo">
    <img th:src="@{/Imágenes/logo.png}" alt="Logo de la red social" class="img-fluid w-25">
        <h1 class="text-lg font-bold">Editar Usuario</h1>
    </div>

    <div class="contenido-principal">
        <h2 class="titulo-seccion">Editar Usuario</h2>
        <form th:action="@{/usuario_editar}" th:object="${usuario}" class="formulario" method="post">
        <div class="rejilla-formulario">
            <div class="campo">
                <input type="hidden" th:field="*{cod_usu}" />
                <label for="ali_usu" class="etiqueta"
                    >Alias del Usuario</label>
                <input type="text" id="ali_usu" name="ali_usu" th:field="*{ali_usu}" class="entrada" required maxlength="100"/>
                <span class="error-message"></span>
            </div>
            <div class="campo">
            <label for="ema_usu" class="etiqueta">Email del Usuario</label>
            <input type="email" id="ema_usu" name="ema_usu" th:field="*{ema_usu}" class="entrada" required maxlength="100"/>
            <span class="error-message"></span>
            </div>
            <div class="campo">
            <label for="cla_usu" class="etiqueta">Clave del usuario</label>
            <input type="password" id="cla_usu" name="cla_usu" th:field="*{cla_usu}" class="entrada" required maxlength="100"/>
            <span class="error-message"></span>
            </div>
            <div class="campo">
            <label for="est_usu" class="etiqueta">Estatus</label>
            <select id="est_usu" name="est_usu"  th:field="*{est_usu}" class="entrada" required>
                <option value="A">Activo</option>
                <option value="I">Inactivo</option>
            </select>
            <span class="error-message"></span>
            </div>
        </div>
        <div class="contenedor-botones">
            <button type="submit" class="boton-accion">Editar</button>
            <a th:href='@{/usuario}' class="boton-secundario">Volver</a>
        </div>
        </form>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"crossorigin="anonymous"></script>  
</body>
</html>
