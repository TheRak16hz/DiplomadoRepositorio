<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href=
        "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
            <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/4.2-rol_listar.css}">

    <title>Listar Rol_Fan_Page</title>
</head>
<body>
    <div class="contenedor-tarjeta">
    <div class="cabecera-logo">
    <img th:src="@{/imagenes/logo.jpeg}" alt="Logo de la red social" class="img-fluid w-25">
    </div>

    <div class="contenido-principal">
        <div class="titulo-solicitud">Datos Roles</div>

        <div class="contenedor-tabla">
        <table class="tabla-centrada">
            <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Fan Page</th>
                <th>Rol</th>
                <th>Estatus</th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(rolfanpages)}">
                    <td colspan="6" class="text-center">No hay roles registrados.</td>
                </tr>
                <tr th:each="rol_fan_page : ${rolfanpages}">
                    <td class="text-center" th:text="${rol_fan_page.getCod_rol_fan()}"></td>
                    <td class="text-center" th:text="${rol_fan_page.persona.getNm1_per()}"></td>
                    <td class="text-center" th:text="${rol_fan_page.persona.getAp1_per()}"></td>
                    <td class="text-center" th:text="${rol_fan_page.nom_fan_page()}"></td>
                    <td class="text-center" th:text="${rol_fan_page.rol.getNom_rol()}"></td>
                    <td class="text-center" th:text="${rol_fan_page.getEst_rol_fan()}"></td>
                    <td class="text-center acciones-tabla">
                        <a href="4.1 -rol_agregar.html" class="boton-accion-tabla" title="Editar">✎</a>
                        <a href="#" class="boton-accion-tabla" title="Eliminar">🗑</a>
                    </td>
                </tr>

            </tbody>
        </table>
        </div>

        <div class="rejilla-botones">
        <button class="boton-accion" onclick="window.location.href='4.1-rol_agregar.html'">Agregar</button>
        <button class="boton-accion"
            th:onclick="|window.location.href='@{/rol_fan_page}'|">Rol</button>
        <button
            class="boton-accion"
            th:onclick="|window.location.href='@{/seguridad}'|"
          >
            Menú Principal
          </button>
        </div>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
