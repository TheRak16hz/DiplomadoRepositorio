<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Rol Fan Page</title>
  </head>
  <body>
    <div class="contenedor-tarjeta">
      <div class="cabecera-logo">
        <img th:src="@{/imagenes/logo.jpeg}" alt="Logo de la red social" class="logo-imagen" />
      </div>

      <div class="contenido-principal">
        <div class="titulo-solicitud">Rol de Fan Page</div>

        <div class="contenedor-tabla">
          <table class="tabla-centrada">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Fan Page</th>
                <th>Rol</th>
                <th>Estatus</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody>

              <tr th:if="${#lists.isEmpty(rolfanpages)}">
                <td colspan="7" class="text-center">No hay roles registrados.</td>
              </tr>

              <tr th:each="rol_fan_page : ${rolfanpages}">
                <td class="text-center" th:text="${rol_fan_page.getCod_rol_fan()}"></td>
                <td class="text-center" th:text="${rol_fan_page.persona.nm1_per}"></td>
                <td class="text-center" th:text="${rol_fan_page.persona.ap1_per}"></td>
                <td class="text-center" th:text="${rol_fan_page.fan_page.nom_fan_pag}"></td>
                <td class="text-center" th:text="${rol_fan_page.rol.nom_rol}"></td>
                <td class="text-center" th:text="${rol_fan_page.getEst_rol_fan()}"></td>
                <td class="text-center acciones-tabla"> <a th:href="@{/rol_fan_page_editar(cod_rol_fan=${rol_fan_page.getCod_rol_fan()})}" class="boton-accion-tabla" title="Editar">✎</a>
                  <a th:href="@{/rol_fan_page_eliminar(cod_rol_fan=${rol_fan_page.getCod_rol_fan()})}" class="boton-accion-tabla btn-eliminar-confirmar" th:data-id="${rol_fan_page.getCod_rol_fan()}" th:data-nombre="'Rol Fan Page ' + ${rol_fan_page.getCod_rol_fan()}" title="Eliminar">🗑️</a>
                </td>
              </tr>
                
            </tbody>
          </table>
        </div>

           <div class="rejilla-botones">
                <button
                    class="boton-accion"
                    th:onclick="|window.location.href='@{/rol_fan_page}'|"
                >
                    Rol Fan Page
                </button>
                
                <button
                    class="boton-accion"
                    th:onclick="|window.location.href='@{/rol_fan_page_agregar}'|"
                >
                    Agregar
                </button>
                
                <button
                    class="boton-accion"
                    th:onclick="|window.location.href='@{/seguridad}'|"
                >
                    Menú Principal
                </button>
            </div>
      </div>
    </div>
          <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
      <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function() {
            
            // 1. MOSTRAR ALERTAS DE ÉXITO O ERROR (Vienen del Controlador)
            /*[# th:if="${exito}"]*/
                Swal.fire({
                    icon: 'success',
                    title: '¡Hecho!',
                    text: [[${exito}]],
                    confirmButtonColor: 'rgba(172, 11, 236, 1)',
                    timer: 3000
                });
            /*[/]*/

            /*[# th:if="${error}"]*/
                Swal.fire({
                    icon: 'error',
                    title: 'Lo siento',
                    text: [[${error}]],
                    confirmButtonColor: 'rgba(172, 11, 236, 1)'
                });
            /*[/]*/


            // 2. LÓGICA DE CONFIRMACIÓN PARA ELIMINAR
            const botonesEliminar = document.querySelectorAll('.btn-eliminar-confirmar');

            botonesEliminar.forEach(boton => {
                boton.addEventListener('click', function(event) {
                    event.preventDefault(); // Evita que se elimine directamente
                    
                    const urlDestino = this.getAttribute('href'); 
                    const codTip = this.getAttribute('data-id');
                    const nomTip = this.getAttribute('data-nombre');

                    Swal.fire({
                        title: '¿Estás seguro?',
                        text: `Vas a eliminar el rol de fan page: ${nomTip} (Código: ${codTip})`,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: 'rgba(172, 11, 236, 1)',
                        cancelButtonColor: '#f122d2ff',
                        confirmButtonText: 'Sí, eliminar',
                        cancelButtonText: 'Cancelar'
                    }).then((result) => {
                        if (result.isConfirmed){                          
                            window.location.href = urlDestino;
                        }
                    });
                });
            });
        });
    </script>
  </body>
</html>
