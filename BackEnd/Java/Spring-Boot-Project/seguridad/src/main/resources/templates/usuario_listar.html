<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Listar Usuarios</title>
  </head>
  <body>
    <div class="contenedor-tarjeta">
      <div class="cabecera-logo">
        <img
          th:src="@{/imagenes/logo.jpeg}"
          alt="Logo de la aplicación"
          class="logo-imagen"
        />
      </div>

      <div class="contenido-principal">
        <div class="titulo-solicitud">Datos Usuarios</div>

        <div class="contenedor-tabla">
          <table class="tabla-centrada">
            <thead>
              <tr>
                <th>Código</th>
                <th>Alias / Usuario</th>
                <th>Email</th>
                <th>Estatus</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="5" class="text-center">
                  No hay usuarios registrados actualmente.
                </td>
              </tr>

              <tr th:each="usuario : ${usuarios}">
                <td class="text-center" th:text="${usuario.cod_usu}"></td>
                <td class="text-center" th:text="${usuario.ali_usu}"></td>
                <td class="text-center" th:text="${usuario.ema_usu}"></td>
                <td class="text-center" th:text="${usuario.est_usu}"></td>

                <td class="text-center acciones-tabla">
                  <a
                    th:href="@{/usuario_editar(cod_usu=${usuario.getCod_usu()})}"
                    th:data-id="${usuario.getCod_usu()}"
                    th:data-nombre="${usuario.getAli_usu()}"
                    class="boton-accion-tabla"
                    title="Editar"
                    >✎</a
                  >
                  <a th:href="@{/usuario_eliminar(cod_usu=${usuario.getCod_usu()})}" th:data-id="${usuario.getCod_usu()}"z th:data-nombre="${usuario.getAli_usu()}" class="boton-accion-tabla btn-eliminar-confirmar" title="Eliminar">🗑️</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="rejilla-botones">
          <button
            class="boton-accion"
            th:onclick="|window.location.href='@{/usuario_agregar}'|"
          >
            Agregar
          </button>

          <button
            class="boton-accion"
            th:onclick="|window.location.href='@{/usuario}'|"
          >
            Usuario
          </button>

          <button
            class="boton-accion"
            th:onclick="|window.location.href='@{/seguridad}'|"
          >
            Menú Principal
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
      <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function() {
            
            // 1. MOSTRAR ALERTAS DE ÉXITO O ERROR (Vienen del Controlador)
            /*[# th:if="${exito}"]*/
                Swal.fire({
                    icon: 'success',
                    title: '¡Hecho!',
                    text: [[${exito}]],
                    confirmButtonColor: 'rgba(172, 11, 236, 1)',
                    timer: 3000
                });
            /*[/]*/

            /*[# th:if="${error}"]*/
                Swal.fire({
                    icon: 'error',
                    title: 'Lo siento',
                    text: [[${error}]],
                    confirmButtonColor: 'rgba(172, 11, 236, 1)'
                });
            /*[/]*/


            // 2. LÓGICA DE CONFIRMACIÓN PARA ELIMINAR
            const botonesEliminar = document.querySelectorAll('.btn-eliminar-confirmar');

            botonesEliminar.forEach(boton => {
                boton.addEventListener('click', function(event) {
                    event.preventDefault(); // Evita que se elimine directamente
                    
                    const urlDestino = this.getAttribute('href'); 
                    const codUsu = this.getAttribute('data-id');
                    const aliUsu = this.getAttribute('data-nombre');

                    Swal.fire({
                        title: '¿Estás seguro?',
                        text: `Vas a eliminar el tipo de privacidad: ${codUsu} (Código: ${aliUsu})`,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: 'rgba(172, 11, 236, 1)',
                        cancelButtonColor: '#f122d2ff',
                        confirmButtonText: 'Sí, eliminar',
                        cancelButtonText: 'Cancelar'
                    }).then((result) => {
                        if (result.isConfirmed){                          
                            window.location.href = urlDestino;
                        }
                    });
                });
            });
        });
    </script>
  </body>
</html>
