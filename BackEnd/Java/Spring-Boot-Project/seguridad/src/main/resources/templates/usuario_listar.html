<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet"integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"crossorigin="anonymous"><link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/4.2-rol_listar.css}">

    <title>Listar Usuario</title>
</head>
<body>
    <div class="contenedor-tarjeta">
    <div class="cabecera-logo">
    <img th:src="@{/imagenes/logo.jpg}" alt="Logo de la red social" class="img-fluid w-25">
    </div>

    <div class="contenido-principal">
        <div class="titulo-solicitud">Datos Usuarios</div>

        <div class="contenedor-tabla">
        <table class="tabla-centrada">
            <thead>
            <tr>
                <th>Código</th>
                <th>Alias Del Usuario</th>
                <th>Email del Usuario</th>
                <th>Clave del Usuario</th>
                <th>Estatus del Usuario</th>
            </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="text-center">No hay Usuarios registrados.</td>
                </tr>
                <tr th:each="usuario : ${usuarios}">
                    <td class="text-center" th:text="${usuario.getCod_usu()}"></td> 
                    
                    <td class="text-center" th:text="${usuario.getAli_usu()}"></td> 
                    <td class="text-center" th:text="${usuario.getEma_usu()}"></td>
                    <td class="text-center" th:text="${usuario.getCla_usu()}"></td> <td class="text-center" th:text="${usuario.getEst_usu()}"></td>
                    
                    <td class="text-center acciones-tablas">
                        <a href="4.1 -rol_agregar.html" class="boton-accion-tabla" title="Editar">✎</a>
                        <a href="#" class="boton-accion-tabla" title="Eliminar">🗑</a>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>

        <div class="rejilla-botones">
        <button class="boton-accion" onclick="window.location.href='4.1-rol_agregar.html'">Agregar</button>
        <button class="boton-accion" th:onclick="|window.location.href='@{/usuario}'|">Usuario</button>
        <button class="boton-accion"
            th:onclick="|window.location.href='@{/seguridad}'|">Menú Principal</button>
        </div>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
