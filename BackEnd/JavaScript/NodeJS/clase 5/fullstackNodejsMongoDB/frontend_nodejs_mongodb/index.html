<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <title>Peliculas</title>
</head>
<body>
    <h1>Gestión de Películas</h1>

    <button id="addMovieBtn" class="button2">Agregar Nueva Película</button>

    <table id="moviesTable">
        <thead>
            <tr>
                <th>Título</th>
                <th>Director</th>
                <th>Año</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Aquí se llenarán las filas con datos -->
        </tbody>
    </table>

    <!-- Formulario para agregar/editar película -->
     <div id="movieFormContainer" class="hidden">
        <h2 id="formTitle">agregar peliculas</h2>
        <form id="movieForm">
            <input type="hidden" id="movieId">

            <label for="title">Titulo:</label>
            <input type="text" id="title" required>

            <label for="director">Director:</label>
            <input type="text" id="director">

            <label for="year">Año:</label>
            <input type="number" id="year">

            <button type="submit" id="submitBtn" class="button1">Agregar</button>

        </form>
        <button id="cancelBtn" class="button3">Cancelar</button>

    </div>
    <script src="script.js"></script>

</body>
</html>
