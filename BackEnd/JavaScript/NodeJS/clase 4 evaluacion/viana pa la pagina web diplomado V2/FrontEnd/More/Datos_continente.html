<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/ubicacion.css">
    <link rel="stylesheet" href="../CSS/bootstrap.min.css">
    <link rel="stylesheet" href="../CSS/estilo.css">
    <title>Datos de continente</title>
</head>
<body>
    <div class="row m-0 pb-5 pt-5 justify-content-center">
        <div class="col-8 text-center">
            <form action="#" method="POST" class="text-center">
                <div class="sombra bg-azul radio-titulo pt-4 pb-4 text-center">
                    <img src="../IMG/banner-1.png" alt="" width="20%" align="center" class="pt-2 pb-2 ">
                </div>
                <div class="sombra indigo pt-2 pb-4 text-center">
                    <div class="col-12 text-center pt-3">
                        <div class="row justify-content-center text-center">
                            <div class="col-md-10 text-center">
                                <div class="row mt-1 mb-1">
                                    <div class="col-md-12 col-12 align-self-center text-center">
                                        <h2 class="miTitulo">Datos de Continente</h2>
                                    </div>
                                </div>
                                <div class="row mt-4 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="cod_con"><b>Código:</b></label>
                                    </div>
                                    <div class="col-md-4 col-12">
                                        <input type="text" name="cod_con" id="cod_con" maxlength="5" class="form-control casilla" placeholder="Código del Continente" title="Inserte el código para identificar el continente">
                                        <span></span>
                                    </div>
                                </div>
                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="nom_con"><b>Nombre:</b></label>
                                    </div>
                                    <div class="col-md-8 col-12">
                                        <input type="text" name="nom_con" id="nom_con" maxlength="80" class="form-control casilla" placeholder="Nombre del Continente" title="Solo Letras">
                                        <span></span>
                                    </div>
                                </div>
                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="des_con"><b>Descripción:</b></label>
                                    </div>
                                    <div class="col-md-6">
                                        <textarea name="des_con" id="des_con" class="form-control casilla" rows="3" maxlength="200" placeholder="Descripción del Continente (Opcional)"></textarea>
                                        <span></span>
                                    </div>
                                </div>
                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="est_con"><b>Estatus:</b></label>
                                    </div>
                                    <div class="col-md-4 col-12">
                                        <select name="est_con" id="est_con" class="form-control casilla">
                                            <option value="">Seleccione...</option>
                                            <option value="A">Activo</option>
                                            <option value="I">Inactivo</option>
                                        </select>
                                        <span></span>
                                    </div>
                                </div>
                                <div class="row mt-5">
                                    <div class="col-12 text-center">
                                        <button class="btn btn-md btn-negrita cursor bg-azul" type="submit">Agregar Continente</button>
                                        <button class="btn btn-md btn-negrita cursor bg-azul" type="button" onclick="window.location.href='../Ubicacion/ubicacion-main.html'">Menú Principal</button>
                                        <input type="hidden" name="accion" id="accion" value="agregar">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="../JS/Continente.js"></script>
</body>
</html>
