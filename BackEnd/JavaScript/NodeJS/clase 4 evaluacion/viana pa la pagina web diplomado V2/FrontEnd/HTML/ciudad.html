<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/bootstrap.min.css">
    <link rel="stylesheet" href="../CSS/styles.css">
    <title>Datos de Ciudad</title>
</head>
<body>
    <div class="row m-0 pb-5 pt-5 justify-content-center">
        <div class="col-8 text-center">
            <form action="#" method="POST" class="text-center" id="form-ciudad">
                <div class="sombra bg-azul radio-titulo pt-4 pb-4 text-center">
                    <img src="../IMG/banner-1.png" alt="" width="20%" align="center" class="pt-2 pb-2 ">
                </div>
                <div class="sombra indigo pt-2 pb-4 text-center">
                    <div class="col-12 text-center pt-3">
                        <div class="row justify-content-center text-center">
                            <div class="col-md-10 text-center">
                                <div class="row mt-1 mb-1">
                                    <div class="col-md-12 col-12 align-self-center text-center">
                                        <h2 class="miTitulo">Datos de Ciudad</h2>
                                    </div>
                                </div>
                                <div class="row mt-4 ml-3">
                                    <!-- <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="cod_ciu"><b>Código:</b></label>
                                    </div> -->
                                    <div>
                                        <input type="hidden" id="id"/> <!--para almacenar el ID al editar-->
                                    </div>
                                    <div class="col-md-4 col-12">
                                        <input type="hidden" name="cod_ciu" id="cod_ciu" maxlength="5" class="form-control casilla" placeholder="Código de la Ciudad" title="Inserte el código para identificar la ciudad">
                                        <!-- <span></span> -->
                                    </div>
                                </div>
                                <!-- <hr class="pt-0 mt-2 mb-2 mt-0"> -->
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="nom_ciu"><b>Nombre:</b></label>
                                    </div>
                                    <div class="col-md-8 col-12">
                                        <input type="text" name="nom_ciu" id="nom_ciu" maxlength="80" class="form-control casilla" placeholder="Nombre de la Ciudad" title="Solo Letras">
                                        <span></span>
                                    </div>
                                </div>
                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="des_ciu"><b>Descripción:</b></label>
                                    </div>
                                    <div class="col-md-6">
                                        <textarea name="des_ciu" id="des_ciu" class="form-control casilla" rows="3" maxlength="200" placeholder="Descripción de la Ciudad (Opcional)"></textarea>
                                        <span></span>
                                    </div>
                                </div>
                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="est_ciu"><b>Estatus:</b></label>
                                    </div>
                                    <div class="col-md-4 col-12">
                                        <select name="est_ciu" id="est_ciu" class="form-control casilla">
                                            <option value="">Seleccione...</option>
                                            <option value="A">Activo</option>
                                            <option value="I">Inactivo</option>
                                        </select>
                                        <span></span>
                                    </div>
                                </div>

                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="fky_est"><b>Estado:</b></label>
                                    </div>
                                    <div class="col-md-4 col-12">
                                        <select name="fky_est" id="fky_est" class="form-control casilla">
                                            <option value="">Slt...</option>
                                        </select>
                                        <span></span>
                                    </div>
                                </div>

                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="fky_zon"><b>Zona Horaria:</b></label>
                                    </div>
                                    <div class="col-md-4 col-12">
                                        <select name="fky_zon" id="fky_zon" class="form-control casilla">
                                            <option value="">Slt2...</option>
                                        </select>
                                        <span></span>
                                    </div>
                                </div>

                                <div class="row mt-5">
                                    <div class="col-12 text-center">
                                        <button class="btn btn-md btn-negrita cursor bg-azul" type="submit">Agregar Ciudad</button>
                                        <button class="btn btn-md btn-negrita cursor bg-azul" type="button" onclick="window.location.href='./ubicacion-main.html'">Menú Principal</button>
                                        <!-- <input type="hidden" name="accion" id="accion" value="agregar"> -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>

            <br><br>
            <div>
                <!--tabla de continentes-->
                <button class="btn-primary rounded" onclick="agregarNuevo()">Limpiar Formulario</button>
                <br><br>
                <h2>lista de estados</h2>
                <table id="tabla-ciudades" class="table-form">
                    <thead>
                        <th>Nombre</th>
                        <th>Descripcion</th>
                        <th>Estado (fk)</th>
                        <th>Zona Horaria (fk)</th>
                        <th>Status</th>
                        <th>Acciones</th>
                    </thead>
                    <tbody>
                        <!--aqui se cargan los datos-->
                    </tbody>
                </table>
            </div>

        </div>
    </div>
    <script src="../JS/CiudadRegex.js"></script>
    <script src="../JS/CiudadScript.js"></script>
</body>
</html>
