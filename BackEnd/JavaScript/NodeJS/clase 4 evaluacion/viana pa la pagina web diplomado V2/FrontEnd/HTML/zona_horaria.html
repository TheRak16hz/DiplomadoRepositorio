<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/bootstrap.min.css">
    <link rel="stylesheet" href="../CSS/styles.css">
    <title>Datos de Zona Horaria</title>
</head>
<body>
    <div class="row m-0 pb-5 pt-5 justify-content-center">
        <div class="col-8 text-center">
            <form action="#" method="POST" class="text-center" id="form-zona-horaria">
                <div class="sombra bg-azul radio-titulo pt-4 pb-4 text-center">
                    <img src="../IMG/banner-1.png" alt="" width="20%" align="center" class="pt-2 pb-2 ">
                </div>
                <div class="sombra indigo pt-2 pb-4 text-center">
                    <div class="col-12 text-center pt-3">
                        <div class="row justify-content-center text-center">
                            <div class="col-md-10 text-center">
                                <div class="row mt-1 mb-1">
                                    <div class="col-md-12 col-12 align-self-center text-center">
                                        <h2 class="miTitulo">Datos de Zona Horaria</h2>
                                    </div>
                                </div>
                                <div>
                                    <input type="hidden" id="id"/> <!--para almacenar el ID al editar-->
                                </div>
                                <div class="row mt-4 ml-3">
                                    <!-- <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="cod_zon"><b>Código:</b></label>
                                    </div> -->
                                    <div class="col-md-4 col-12">
                                        <input type="hidden" name="cod_zon" id="cod_zon" maxlength="5" class="form-control casilla" placeholder="Código de la Zona Horaria" title="Inserte el código para identificar la zona horaria">
                                        <!-- <span></span> -->
                                    </div>
                                </div>
                                <!-- <hr class="pt-0 mt-2 mb-2 mt-0"> -->
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="nom_zon"><b>Nombre:</b></label>
                                    </div>
                                    <div class="col-md-8 col-12">
                                        <input type="text" name="nom_zon" id="nom_zon" maxlength="80" class="form-control casilla" placeholder="Nombre de la Zona Horaria" title="Solo Letras">
                                        <span></span>
                                    </div>
                                </div>
                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="acr_zon"><b>Acrónimo:</b></label>
                                    </div>
                                    <div class="col-md-4 col-12">
                                        <input type="text" name="acr_zon" id="acr_zon" maxlength="10" class="form-control casilla" placeholder="Ej: GMT, EST, PST" title="Acrónimo de la zona horaria">
                                        <span></span>
                                    </div>
                                </div>
                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="dif_zon"><b>Diferencia GMT:</b></label>
                                    </div>
                                    <div class="col-md-4 col-12">
                                        <input type="text" name="dif_zon" id="dif_zon" maxlength="6" class="form-control casilla" placeholder="Ej: +5, -3, +5.5" title="Diferencia en horas respecto al meridiano de Greenwich">
                                        <span></span>
                                    </div>
                                </div>
                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="est_zon"><b>Estatus:</b></label>
                                    </div>
                                    <div class="col-md-4 col-12">
                                        <select name="est_zon" id="est_zon" class="form-control casilla">
                                            <option value="">Seleccione...</option>
                                            <option value="A">Activo</option>
                                            <option value="I">Inactivo</option>
                                        </select>
                                        <span></span>
                                    </div>
                                </div>
                                <div class="row mt-5">
                                    <div class="col-12 text-center">
                                        <button class="btn btn-md btn-negrita cursor bg-azul" type="submit">Guardar</button>
                                        <button class="btn btn-md btn-negrita cursor bg-azul" type="button" onclick="window.location.href='./ubicacion-main.html'">Menú Principal</button>
                                        <!-- <input type="hidden" name="accion" id="accion" value="agregar"> -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            <br><br>

            <div>
                <!--tabla de continentes-->
                <button class="btn-primary rounded" onclick="agregarNuevo()">Limpiar Formulario</button>
                <br><br>
                <h2>lista de zonas horarias</h2>
                <table id="tabla-zonas-horarias" class="table-form">
                    <thead>
                        <th>Nombre</th>
                        <th>Acrónimo</th>
                        <th>Diferencia</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </thead>
                    <tbody>
                        <!--aqui se cargan los datos-->
                    </tbody>
                </table>
            </div>

        </div>
    </div>
    <script src="../JS/zonaHorariaRegex.js"></script>
    <script src="../JS/zonaHorariaScript.js"></script>
</body>
</html>
