<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/bootstrap.min.css">
    <link rel="stylesheet" href="../CSS/styles.css">
    <title>Datos de País</title>
</head>
<body>
    <div class="row m-0 pb-5 pt-5 justify-content-center">
        <div class="col-8 text-center">
            <form action="#" method="POST" class="text-center" id="form-pais">
                <div class="sombra bg-azul radio-titulo pt-4 pb-4 text-center">
                    <img src="../IMG/banner-1.png" alt="" width="20%" align="center" class="pt-2 pb-2 ">
                </div>
                <div class="sombra indigo pt-2 pb-4 text-center">
                    <div class="col-12 text-center pt-3">
                        <div class="row justify-content-center text-center">
                            <div class="col-md-10 text-center">
                                <div class="row mt-1 mb-1">
                                    <div class="col-md-12 col-12 align-self-center text-center">
                                        <h2 class="miTitulo">Datos de País</h2>
                                    </div>
                                </div>
                                <div>
                                    <input type="hidden" id="id"/> <!--para almacenar el ID al editar-->
                                </div>
                                <div class="row mt-4 ml-3">
                                    <!-- <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="cod_pai"><b>Código:</b></label>
                                    </div> -->
                                    <div class="col-md-4 col-12">
                                        <input type="hidden" name="cod_pai" id="cod_pai" maxlength="5" class="form-control casilla" placeholder="Código del País" title="Inserte el código para identificar el país">
                                        <!-- <span></span> -->
                                    </div>
                                </div>
                                <!-- <hr class="pt-0 mt-2 mb-2 mt-0"> -->
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="nom_pai"><b>Nombre:</b></label>
                                    </div>
                                    <div class="col-md-8 col-12">
                                        <input type="text" name="nom_pai" id="nom_pai" maxlength="80" class="form-control casilla" placeholder="Nombre del País" title="Solo Letras">
                                        <span></span>
                                    </div>
                                </div>
                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="des_pai"><b>Descripción:</b></label>
                                    </div>
                                    <div class="col-md-6">
                                        <textarea name="des_pai" id="des_pai" class="form-control casilla" rows="3" maxlength="200" placeholder="Descripción del País (Opcional)"></textarea>
                                        <span></span>
                                    </div>
                                </div>
                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="ali_pai"><b>Alias:</b></label>
                                    </div>
                                    <div class="col-md-6 col-12">
                                        <input type="text" name="ali_pai" id="ali_pai" maxlength="50" class="form-control casilla" placeholder="Alias o nombre común del País" title="Nombre alternativo del país">
                                        <span></span>
                                    </div>
                                </div>
                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="cti_pai"><b>Código Telefónico:</b></label>
                                    </div>
                                    <div class="col-md-4 col-12">
                                        <input type="text" name="cti_pai" id="cti_pai" maxlength="5" class="form-control casilla" placeholder="Ej: +58, +1, +34" title="Código telefónico internacional">
                                        <span></span>
                                    </div>
                                </div>
                                <hr class="pt-0 mt-2 mb-2 mt-0">
                                <div class="row mt-1 ml-3">
                                    <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                        <label for="est_pai"><b>Estatus:</b></label>
                                    </div>
                                    <div class="col-md-4 col-12">
                                        <select name="est_pai" id="est_pai" class="form-control casilla">
                                            <option value="">Seleccione...</option>
                                            <option value="A">Activo</option>
                                            <option value="I">Inactivo</option>
                                        </select>
                                        <span></span>
                                    </div>
                                </div>
                                <hr class="pt-0 mt-2 mb-2 mt-0">

                                    <div class="row mt-1 ml-3">
                                        <div class="col-md-4 col-12 align-self-center text-left pt-2">
                                            <label for="fky_con"><b>Continente:</b></label>
                                        </div>
                                        <div class="col-md-4 col-12" id="fky_con_div">
                                            <select name="fky_con" id="fky_con" class="form-control casilla">
                                                <option value="">Slt...</option>
                                            </select>
                                            <span></span>
                                        </div>
                                    </div>

                                <div class="row mt-5">
                                    <div class="col-12 text-center">
                                        <button class="btn btn-md btn-negrita cursor bg-azul" type="submit">Agregar País</button>
                                        <button class="btn btn-md btn-negrita cursor bg-azul" type="button" onclick="window.location.href='./ubicacion-main.html'">Menú Principal</button>
                                        <!-- <input type="hidden" name="accion" id="accion" value="agregar"> -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>

            <br><br>
            <div>
                <!--tabla de continentes-->
                <button class="btn-primary rounded" onclick="agregarNuevo()">Limpiar Formulario</button>
                <br><br>
                <h2>lista de paises</h2>
                <table id="tabla-paises" class="table-form">
                    <thead>
                        <th>Nombre</th>
                        <th>Descripcion</th>
                        <th>Alias</th>
                        <th>Codigo telefonico</th>
                        <th>Continente (fk)</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </thead>
                    <tbody>
                        <!--aqui se cargan los datos-->
                    </tbody>
                </table>
            </div>

        </div>
    </div>
    <script src="../JS/PaisRegex.js"></script>
    <script src="../JS/PaisScript.js"></script>
</body>
</html>
