<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./estilos.css">
    <title>Calculadora virutal</title>
</head>
<body>
    <h1>bienvenido a mi calcualdora</h1>
    <div class="container">
        <form action="">
        <label for="n1">un primer numero</label>
        <input type="text" name="n1" id="n1">
        <label for="n2">segundo numero</label>
        <input type="text" name="n2" id="n2">
        <select name="operacion" id="operacion">
            <option value="sumar">sumar</option>
            <option value="restar">restar</option>
            <option value="multiplicar">multiplicar</option>
            <option value="dividir">dividir</option>
            <option value="potencia">potencia</option>
            <option value="raiz">raiz</option>
            <option value="mayor">mayor</option>
            <option value="menor">menor</option>
            <option value="igualdad">igualdad</option>
            <option value="modulo">modulo (residuo %)</option>
            <option value="factorial">factorial (n!)</option>
        </select>
        <label id="resultadoLabel">Resultado: </label>
    </form>
    <button onclick="calcular()">calcular</button>
    </div>
    <script src="./script.js"></script>
</body>
</html>
