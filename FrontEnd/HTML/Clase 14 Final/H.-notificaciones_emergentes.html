<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones Emergentes</title>
    <link rel="stylesheet" href="../../CSS/Bootstrap/css/bootstrap.min.css">
</head>
<body>
    <div class="toast-container position-absolute p-3" style="right: 0; bottom: 0;">
        <div class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Nueva Solicitud de Amistad</strong>
                <small>hace 1 minuto</small>
                <button type="button" class="btn-close close" aria-label="close" data-dismiss="toast"></button>
            </div>
            <div class="toast-body">
                Persona x ha solicitado ser tu amigo en nuestra red social
            </div>
        </div>
    </div>
    <script src="../../JS/Javascript/js/bootstrap.bundle.min.js"></script>
    <script>
    // Espera a que el DOM se cargue completamente
    document.addEventListener('DOMContentLoaded', function () {
        // Inicializa todos los toast en la página
        const toastElements = document.querySelectorAll('.toast');

        toastElements.forEach(toastEl => {
            // Configura el toast para que se cierre automáticamente
            const toast = new bootstrap.Toast(toastEl, {
                autohide: true,
                delay: 3000 // tiempo en milisegundos (3 segundos)
            });

            toast.show();
        });
    });
</script>

</body>
</html>
