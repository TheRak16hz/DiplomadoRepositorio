<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=|, initial-scale=1.0">
    <link rel="stylesheet" href="../../CSS/Bootstrap/css/bootstrap.min.css">
    <title>Formularios</title>
</head>
<body>
    <div class="container">
        <!-- definimos un margen superior de 3 aprox 16 pixeles -->
        <div class="row mt-3">
        </div>
        <!-- definimos un margen superior a 3 -->
        <div class="row mt-3">
            <!-- define el ancho de una columna, ocupara 5 de las 12 columnas disponibles en la pantalla -->
            <div class="col-5">
                <div class="col">
                    <label for="continente" class="form-label">Continente:</label>
                    <select name="continente" id="continente" class="form-select mb-3">
                        <option value="">Seleccione...</option>
                        <option value="1">America</option>
                        <option value="2">Asia</option>
                        <option value="3">Africa</option>
                        <option value="4">Europa</option>
                        <option value="5">Oceania</option>
                    </select>
                </div>
                <div class="col">
                    <label for="continente" class="form-label">Contiente:</label>
                    <!-- Multiple significa que el usuario puede seleccionar multiples opciones de la lista desplegable -->
                    <!-- Mostrará 8 opciones a la vez -->
                    <select multiple size="8" name="continente" id="continente" class="form-select mb-3">
                        <option value="">Seleccione...</option>
                        <option value="1">America</option>
                        <option value="2">Asia</option>
                        <option value="3">Africa</option>
                        <option value="4">Europa</option>
                        <option value="5">Oceania</option>
                    </select>
                </div>
            </div>
        </div>
        <!-- definimos un margen superior de 3 aprox 16 pixeles -->
        <div class="row mt-3">
            <!-- cajas de chequeo -->
            <!-- definimos el ancho de una columna, ocupará 4 de las 12 columnas disponibles en la pantalla -->
            <div class="col-4">
                <!-- definimos una columna con un margen de 4 -->
                <div class="col m-4">
                    <label for="" class="form-label"><b>Cuadros de Chequeo:</b></label>
                    <div class="form-check">
                        <input type="checkbox" name="pro_bas" class="form-check-input" id="1">
                        <label for="1" class="form-check-label">Opcion 1</label>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" name="pro_bas" class="form-check-input" id="2">
                        <label for="2" class="form-check-label">Opcion 2</label>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" name="pro_bas" class="form-check-input" id="3">
                        <label for="3" class="form-check-label">Opcion 3</label>
                    </div>
                </div>
                <!-- radio seleccion -->
                <div class="col m-4">
                    <label for="" class="form-label"><b>Radio Seleccion:</b></label>
                    <div class="form-check">
                        <input type="radio" name="radio-nombre" class="form-check-input" id="radio-1">
                        <label for="radio-1" class="form-check-label">Opcion 1</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" name="radio-nombre" class="form-check-input" id="radio-2">
                        <label for="radio-2" class="form-check-label">Opcion 2</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" name="radio-nombre" class="form-check-input" id="radio-3">
                        <label for="radio-3" class="form-check-label">Opcion 3</label>
                    </div>
                </div>
                <!-- switch -->
                <div class="col m-4">
                    <label for="" class="form-label"><b>Seleccion de Switch:</b></label>
                    <div class="form-check form-switch">
                        <input type="checkbox" name="switch-1" class="form-check-input" id="switch-1">
                        <label for="switch-1" class="form-check-label">Opcion 1</label>
                    </div>
                    <div class="form-check form-switch">
                        <input type="checkbox" name="switch-2" class="form-check-input" id="switch-2">
                        <label for="switch-2" class="form-check-label">Opcion 2</label>
                    </div>
                    <div class="form-check form-switch">
                        <input type="checkbox" name="switch-3" class="form-check-input" id="switch-3">
                        <label for="switch-3" class="form-check-label">Opcion 3</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../JS/Javascript/js/bootstrap.bundle.min.js"></script>
</body>
</html>
