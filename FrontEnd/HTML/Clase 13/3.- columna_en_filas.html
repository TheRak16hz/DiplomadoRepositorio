<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../CSS/Bootstrap/css/3.- columnas_en_filas.css">
    <link rel="stylesheet" href="../../CSS/Bootstrap/css/bootstrap.min.css">
    <title>Columnas en filas</title>
</head>
<body>
    <div class="container">
        <!--asignacion de columnas en una fila-->
        <!--cuando se usa la clase row-cols-4 en un contenedor .row, Bootstrap automaticamente aplica el estilo necesario a todos los elementos hijos directos para que se comporte como columna, divididas en grupos de cuatro por fila. esto significa que: El Primer, segundo, tercer, y cuerto elemento se ubicaran uno al lado del otro. el quinto elemento pasara a la siguente fila, cada columna copara el 25% del ancho de la fila-->
        <div class="row row-cols-4">
            <div class="columna-interna">Columna Interna N°1</div>
            <div class="columna-interna">Columna Interna N°2</div>
            <div class="columna-interna">Columna Interna N°3</div>
            <div class="columna-interna">Columna Interna N°4</div>
            <div class="columna-interna">Columna Interna N°5</div>
            <div class="columna-interna">Columna Interna N°6</div>
            <div class="columna-interna">Columna Interna N°7</div>
            <div class="columna-interna">Columna Interna N°8</div>
            <div class="columna-interna">Columna Interna N°9</div>
            <div class="columna-interna">Columna Interna N°10</div>
            <div class="columna-interna">Columna Interna N°11</div>
            <div class="columna-interna">Columna Interna N°12</div>
        </div>
        <!--asignacion de columnas a una fila-->
    </div>

    <script src="../../JS/Javascript/js/bootstrap.min.js"></script>
</body>
</html>
