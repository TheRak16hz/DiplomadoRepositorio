<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../CSS/Bootstrap/css/6.- espaciado_entre_columnas.css">
    <link rel="stylesheet" href="../../CSS/Bootstrap/css/bootstrap.min.css">
    <title>Espacio entre columnas</title>
</head>
<body>
    <div class="container">
        <!--las clases de espaciado con la letra g se utilizan para controlar el espacio (padding y margin) entre las columnas de una fila y entre las filas de un contenedor. se aplican a la clase .row y utiliza la misma escala que las clases de espaciado de bootstrap (de0 a 5)
        g-0     Espaciado nulo
        gx-5    Espaciado horizontal
        gy-5    Espaciado vertical
        -->
        <div class="row gx-5">
            <div class="col-6">
                <div class="columna-propia">Columna</div>
            </div>
            <div class="col-6">
                <div class="columna-propia">Columna</div>
            </div>
            <div class="col-6">
                <div class="columna-propia">Columna</div>
            </div>
            <div class="col-6">
                <div class="columna-propia">Columna</div>
            </div>
            <div class="col-6">
                <div class="columna-propia">Columna</div>
            </div>
            <div class="col-6">
                <div class="columna-propia">Columna</div>
            </div>
        </div>
    </div>

    <script src="../../JS/Javascript/js/bootstrap.min.js"></script>
</body>
</html>
